<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Parse Tree Generator</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <header class="auth-header">
      <h1>Parse Tree Generator</h1>
      <p>Log in to save your work and see your history</p>
    </header>

    <section class="auth-card">
      <div class="auth-tabs" role="tablist">
        <button type="button" id="tab-login" role="tab" aria-selected="true">Log in</button>
        <button type="button" id="tab-register" role="tab" aria-selected="false">Register</button>
      </div>

      <!-- novalidate: our own messages in login.js are shown instead of the browser's pop-ups -->
      <form id="auth-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254"
               placeholder="name@example.com" aria-describedby="auth-msg">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128"
               placeholder="At least 10 characters" aria-describedby="auth-msg">

        <button class="btn" id="submit-btn" type="submit">Log in</button>
        <div id="auth-msg" class="auth-msg" role="alert" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
